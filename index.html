      --text-3: #999;
      --bg: #F5F6F8;
      --white: #FFF;
      --border: #F0F0F0;
      --green: #34C77B;
      --green-bg: #EEFBF3;
      --orange: #FF8C42;
      --orange-bg: #FFF5ED;

      --blue-bg: #EDF4FD;

    body {

      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-title {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-1);
      padding: 0 16px 10px;

    /* Stage Tabs (Tier 1) */
    .stage-tabs {

      justify-content: center;
      gap: 6px;
      padding: 0 16px 8px;
    }
    .stage-tab {

      border-radius: 20px;
      font-size: 13px;
      color: var(--text-2);
      background: rgba(255,255,255,0.6);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .stage-tab.active {

      color: var(--white);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(255,77,106,0.3);
    }
    /* Week Tabs (Tier 2) */

      gap: 0;

      scrollbar-width: none;
      justify-content: center;

    .week-tab {

      border-radius: 16px;
      font-size: 12px;
      color: var(--text-3);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .week-tab.active {
      background: var(--white);
      color: var(--primary);
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    /* === Module 1: Baby Overview === */
    .module-1 { padding: 0 14px; margin-top: 6px; }

    .baby-overview {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }
    .overview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .overview-left { flex: 1; }
    .overview-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 6px;
    }
    .overview-desc {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }
    .overview-right {
      width: 72px;
      height: 72px;
      margin-left: 12px;
      flex-shrink: 0;
    }
    .overview-right img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .stat-item {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      background: #FAFBFC;
      border-radius: 10px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-3);
      margin-bottom: 3px;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
    }
    .stat-unit {
      font-size: 11px;
      color: var(--text-3);
      font-weight: 400;
    }

      background: var(--white);

      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }
    .changes-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 12px;
    }
    .changes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .change-col {
      background: #FAFBFC;
      border-radius: 10px;
      padding: 12px;
    }
    .change-col-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .change-col-title.traits { color: var(--orange); }
    .change-col-title.prepare { color: var(--blue); }
    .change-item {
      font-size: 12px;
      color: var(--text-2);
      padding: 5px 0;
      border-bottom: 1px dashed var(--border);
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1.5;
    }
    .change-item:last-child { border-bottom: none; }
    .change-item:hover { color: var(--primary); }
    .change-item::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .change-col.traits-col .change-item::before { background: var(--orange); }
    .change-col.prepare-col .change-item::before { background: var(--blue); }

    .qa-bar {
      background: linear-gradient(135deg, #FFF5F7 0%, #FFF0F3 100%);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      border: 1px solid rgba(255,77,106,0.08);

      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;

    .qa-text {

      color: var(--text-1);
      font-weight: 500;

      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 10px;

      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 4px;

      align-items: center;

      scrollbar-width: none;

      border-radius: 18px;
      font-size: 12px;
      color: var(--text-2);
      background: var(--white);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;

    .cat-tab.active {
      background: var(--primary-bg);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 600;

    @keyframes focusPulse {
      0%, 100% { transform: scale(1); }

      margin-top: 10px;

      justify-content: center;

      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 4px;

    .ai-product-reason {

      color: var(--primary);
      line-height: 1.5;
      margin-bottom: 6px;
      background: rgba(255,77,106,0.06);
      padding: 4px 8px;
      border-radius: 6px;

      font-weight: 700;
      color: var(--primary);

      color: var(--text-3);

      font-weight: 400;
      margin-left: 6px;

      color: var(--text-3);
      margin-bottom: 8px;
      padding-left: 2px;

      text-align: center;

    .alt-product-img {
      width: 48px;
      height: 48px;
      margin: 0 auto 6px;
      background: #FAFBFC;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .alt-product-img img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }
    .alt-product-name {
      font-size: 11px;
      color: var(--text-2);
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .alt-product-price {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    /* Utilities */
    .section-gap { height: 10px; }
    .scroll-smooth { scroll-behavior: smooth; }
  </style>
</head>

function getWeekKey() {
  return `s${currentStage + 1}_${currentWeek}`;
}

  const container = document.getElementById('stageTabs');
  container.innerHTML = DATA.stages.map((s, i) =>
    `<button class="stage-tab ${i === currentStage ? 'active' : ''}" onclick="selectStage(${i})">${s.label}</button>`

}

function renderWeekTabs() {
  const container = document.getElementById('weekTabs');
  const stage = DATA.stages[currentStage];
  container.innerHTML = stage.weeks.map((w, i) =>
    `<button class="week-tab ${i === currentWeek ? 'active' : ''}" onclick="selectWeek(${i})">${w}</button>`
  ).join('');
}

function renderModule2() {
  const container = document.getElementById('module2');
  const key = getWeekKey();
  const d = DATA.weeks[key];
  if (!d) { container.innerHTML = ''; return; }

  const stageId = DATA.stages[currentStage].id;
  const availableCats = DATA.catsPerStage[stageId];

  // Ensure currentCat is within available range
  const focusIdx = availableCats.indexOf(d.focusCat);
  if (currentCat >= availableCats.length) currentCat = focusIdx >= 0 ? focusIdx : 0;

  const activeCatId = availableCats[currentCat];
  const catData = d.products[activeCatId];

  container.innerHTML = `
    <div class="module-2-title">🛍️ 为宝宝智选好物</div>
    <!-- Category Tabs -->
    <div class="cat-tabs">

}

// ========== INTERACTIONS ==========
function selectStage(idx) {
  currentStage = idx;
  currentWeek = 0;
  currentCat = 0;
  renderAll();
}

function selectWeek(idx) {
  currentWeek = idx;
  // Auto-jump to focus category
  const key = getWeekKey();
  const d = DATA.weeks[key];
  if (d) {
    const stageId = DATA.stages[currentStage].id;
    const availableCats = DATA.catsPerStage[stageId];
    const focusIdx = availableCats.indexOf(d.focusCat);
    currentCat = focusIdx >= 0 ? focusIdx : 0;
  }
  renderAll();
}

function selectCat(idx) {
  currentCat = idx;
  renderModule2();
}

function jumpToCat(catId) {
  const stageId = DATA.stages[currentStage].id;
  const availableCats = DATA.catsPerStage[stageId];
  const idx = availableCats.indexOf(catId);
  if (idx >= 0) {
    currentCat = idx;
    renderModule2();
    document.getElementById('module2').scrollIntoView({ behavior: 'smooth' });
  }
}

function jumpToCatFromPrepare(text) {
  // Map prepare text to category based on keywords
  const mapping = {
    '奶': 'eat', '辅食': 'eat', '食': 'eat', '喂': 'eat', '奶粉': 'eat', '米粉': 'eat', '吃': 'eat',
    '尿': 'use', '牙': 'use', '玩具': 'use', '安全': 'use', '洗': 'use', '围栏': 'use',
    '衣': 'clothes', '鞋': 'clothes', '袜': 'clothes', '帽': 'clothes', '穿': 'clothes',
    '车': 'travel', '出': 'travel', '推车': 'travel', '座椅': 'travel', '外出': 'travel',
    '书': 'learn', '绘本': 'learn', '读': 'learn', '卡片': 'learn', '语': 'learn',
    '早教': 'improve', '积木': 'improve', '拼': 'improve', '训练': 'improve'
  };
  let targetCat = null;
  for (const [keyword, cat] of Object.entries(mapping)) {
    if (text.includes(keyword)) { targetCat = cat; break; }
  }
  if (targetCat) jumpToCat(targetCat);
  else jumpToCat(DATA.weeks[getWeekKey()].focusCat);
}

function searchQuestion(q) {
  // Simulate search/jump
  alert('正在为您搜索: ' + q);
}

function renderAll() {
  renderStageTabs();
  renderWeekTabs();
  renderModule1();
  renderModule2();
}

renderAll();
